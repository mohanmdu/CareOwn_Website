name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - name: Install & build
        run: |
          npm ci
          npm run build
      - name: Package
        run: tar czf website.tar.gz -C dist/company-website/browser .
      - name: Upload
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'website.tar.gz'
          target: '/home/ci/incoming/'
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            rm -rf /home/ci/incoming/website && mkdir -p /home/ci/incoming/website
            tar xzf /home/ci/incoming/website.tar.gz -C /home/ci/incoming/website
            sudo /home/CareOwn_HMS/scripts/deploy-website.sh /home/ci/incoming/website
