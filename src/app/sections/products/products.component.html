<section class="section" id="products">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow">What We Build</span>
      <h2>One Platform, Every Department</h2>
      <p>Nine connected products, laid out the way your teams actually think about them.</p>
    </div>

    <div class="bento">
      @for (tile of tiles; track tile.title) {
        @if (tile.size === 'big') {
          <div class="bento-tile big fill" [class.t-teal-fill]="tile.fill === 'teal'" [class.t-blue-fill]="tile.fill === 'blue'">
            <span class="bento-icon"><app-icon [name]="tile.icon" /></span>
            <h3>{{ tile.title }}</h3>
            @if (tile.body) {
              <p>{{ tile.body }}</p>
            }
          </div>
        } @else {
          <div class="bento-tile card">
            <span class="bento-icon" [class]="tile.iconClass"><app-icon [name]="tile.icon" /></span>
            <h3>{{ tile.title }}</h3>
          </div>
        }
      }
    </div>
  </div>
</section>
