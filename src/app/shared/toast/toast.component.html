@if (toast(); as t) {
  <div class="toast" [class.toast--error]="t.type === 'error'" role="status" aria-live="polite">
    <span class="toast-icon"><app-icon [name]="t.type === 'success' ? 'check' : 'close'" /></span>
    <p class="toast-message">{{ t.message }}</p>
    <button type="button" class="toast-close" (click)="dismiss()" aria-label="Dismiss">
      <app-icon name="close" />
    </button>
  </div>
}
